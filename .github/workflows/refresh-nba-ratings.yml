name: Refresh NBA 2K ratings

# The basketball twin of refresh-ratings.yml. 2K Ratings publishes its update calendar on every player's
# season chart (data/nba/movement.json "labels": every other Thursday — Nov. 5, Nov. 19, Dec. 3 ...).
# Owner 2026-10-26: only call the site on the day it actually refreshes. The cron fires daily but the
# gate reads the committed calendar (tools/nba_update_due.py, no request to 2K Ratings) and lets the run
# through only on an update day, retrying daily until that update lands. An update-day run opens every
# player page (attributes and badges). The fetcher exits 3 on a quiet day (nothing committed), 0 when it
# wrote files, 2 when the site or a sanity check broke. Roster moves between update days wait for the next one.
on:
  schedule:
    - cron: "41 15 * * *"      # 15:41 UTC (GitHub starts it ~3-5 h late); the gate decides whether it does anything
  workflow_dispatch:
    inputs:
      full:
        description: "Open every player page (attributes and badges), not just the ones whose overall moved"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with refresh-ratings.yml: the two bots never push to main at the same time.
concurrency:
  group: ratings-push
  cancel-in-progress: false

# Owner 2026-09-23: "2K ratings don't need to start updating until the season starts".
# Scheduled runs are skipped before opening night (2026-27 regular season opens Tue 2026-10-20);
# a manual "Run workflow" always goes through. After opening night this gate is a no-op.
env:
  SEASON_START: "2026-10-20"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%F)" \< "$SEASON_START" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Off-season: scheduled 2K refresh skipped until $SEASON_START"
          else
            WHY=$(python3 tools/nba_update_due.py)
            echo "::notice::$WHY"
            case "$WHY" in due:*) echo "run=true" >> "$GITHUB_OUTPUT" ;; *) echo "run=false" >> "$GITHUB_OUTPUT" ;; esac
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Pinned 2026-10-25: ubuntu-latest became Ubuntu 26.04 on 2026-10-19 and Playwright 1.60 cannot install
    # chromium there ("does not support chromium on ubuntu26.04-x64"); every refresh failed 10-20..10-25.
    # Unpin once a Playwright release supports 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a real browser (the site refuses plain HTTP clients)
        run: |
          pip install --quiet playwright==1.60.0
          python3 -m playwright install --with-deps chromium
      # The parser's regression tests run first, offline, against saved pages (a thin sheet, a full sheet,
      # a team page, a broken page). A parser change that would mis-read the site fails HERE, before a
      # single request goes out — and long before it can page the owner (2026-09-20).
      - name: Parser regression tests (offline)
        run: python3 tools/test_fetch_nba.py
      # What the page does with a player nobody has on a roster — driven in the browser Playwright
      # already installed above, against the committed data files.
      - name: Free-agent page tests (offline)
        run: python3 tools/test_free_agents.py
      - name: Fetch the ratings
        id: fetch
        run: |
          set +e
          FULL=""
          # A scheduled run only gets past the gate on an update day, so it opens every player page.
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then FULL="--full"; fi
          python3 tools/fetch_nba_ratings.py $FULL 2> >(tee fetch.err >&2)
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "reason=$(tail -n 1 fetch.err 2>/dev/null | cut -c1-200)" >> "$GITHUB_OUTPUT"
      - name: Commit the snapshot
        if: steps.fetch.outputs.rc == '0'
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data/nba
          git commit -m "NBA 2K ratings snapshot: $(python3 -c "import json;d=json.load(open('data/nba/ratings.json'));print(d['iteration']['label'],'·',d['count'],'players')")"
          # 2026-09-21: a tracked .pyc regenerated by the test step made `git pull --rebase` refuse ("unstaged changes") and
          # paged the owner as a FAILED refresh although the fetch was fine. __pycache__ is untracked now; autostash keeps
          # any stray working-tree change from ever blocking the snapshot commit again.
          git -c rebase.autoStash=true pull --rebase
          git push
      - name: Fail loudly if the fetch broke (rc 2 = fetch/sanity failure; 3 = unchanged, fine)
        if: steps.fetch.outputs.rc != '0' && steps.fetch.outputs.rc != '3'
        run: |
          echo "fetch_nba_ratings.py exited ${{ steps.fetch.outputs.rc }}"
          exit 1
      - name: Tell the owner on Telegram if anything failed
        if: failure()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RC: ${{ steps.fetch.outputs.rc }}
          REASON: ${{ steps.fetch.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$BOT" ] && [ -n "$CHAT" ] || { echo "no Telegram secrets; skipping alert"; exit 0; }
          TEXT="🏀 Janafari NBA 2K ratings refresh FAILED (fetch rc=${RC:-?}). ${REASON:-2K Ratings or the commit step broke} — the page keeps its last good numbers. ${RUN_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${TEXT}" -o /dev/null \
            || echo "Telegram alert could not be sent"
