name: Refresh Madden ratings

# EA posts roster updates weekly during the season, but not always on the same weekday. Check the
# official feed every day (the fetcher exits 1 = unchanged, so nothing is committed on quiet days);
# commit the snapshot only when it changed, and GitHub Pages redeploys from the commit. Run by hand
# from the Actions tab.
on:
  schedule:
    - cron: "17 15 * * *"      # every day 15:17 UTC (11:17 ET); a no-change run costs ~15 s
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Skip EA and fail on purpose, to prove the Telegram alert fires"
        type: boolean
        default: false

permissions:
  contents: write

# One ratings push at a time: this workflow and refresh-nba-ratings.yml share the group, so the two
# bots can never race each other's push to main (Codex, 2026-09-19); a scheduled and a manual run of
# the same workflow queue behind each other for the same reason.
concurrency:
  group: ratings-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the feed
        id: fetch
        run: |
          set +e
          if [ "${{ inputs.test_alert }}" = "true" ]; then echo "test_alert: simulating a failed fetch"; false; else python3 tools/fetch_ratings.py; fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Commit the snapshot
        if: steps.fetch.outputs.rc == '0'
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data/ratings.json data/stats data/history.json
          git commit -m "Ratings snapshot: $(python3 -c "import json;d=json.load(open('data/ratings.json'));print(d['iteration']['label'],'·',d['count'],'players')")"
          git pull --rebase
          git push
      - name: Fail loudly if the fetch broke (rc 2 = fetch/sanity failure; 3 = unchanged, fine)
        if: steps.fetch.outputs.rc != '0' && steps.fetch.outputs.rc != '3'
        run: |
          echo "fetch_ratings.py exited ${{ steps.fetch.outputs.rc }}"
          exit 1
      # A silent failure is the one thing this workflow must never do: the page would keep saying
      # "updated <old date>" in 13px grey. Any failed step (fetch, commit, push) sends one Telegram
      # message to the owner. Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (repo settings).
      - name: Tell the owner on Telegram if anything failed
        if: failure()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RC: ${{ steps.fetch.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$BOT" ] && [ -n "$CHAT" ] || { echo "no Telegram secrets; skipping alert"; exit 0; }
          TEXT="🏈 Janafari ratings refresh FAILED (fetch rc=${RC:-?}). EA's feed or the commit step broke — the page keeps its last good numbers. ${RUN_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${TEXT}" -o /dev/null \
            || echo "Telegram alert could not be sent"
