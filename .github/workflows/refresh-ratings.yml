name: Refresh Madden ratings

# EA posts each week's ratings on Friday afternoon (Week 2 to Week 6 all landed on a Friday; EA announced
# Week 5 at 14:52 ET on Fri 2026-10-16). Owner 2026-10-26: only call on the day it actually refreshes.
# So: Friday, plus one Saturday retry for a late post; the fetcher exits 1 = unchanged, so the retry commits
# nothing when Friday already got it. Commit the snapshot only when it changed, and GitHub Pages redeploys
# from the commit. Run by hand from the Actions tab.
on:
  schedule:
    - cron: "17 19 * * 5"      # Friday 19:17 UTC (15:17 ET); GitHub starts it ~1-4 h late, after EA's post
    - cron: "17 15 * * 6"      # Saturday 15:17 UTC: one retry if Friday's post was late
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Skip EA and fail on purpose, to prove the Telegram alert fires"
        type: boolean
        default: false

permissions:
  contents: write

# One ratings push at a time: this workflow and refresh-nba-ratings.yml share the group, so the two
# bots can never race each other's push to main (Codex, 2026-09-19); a scheduled and a manual run of
# the same workflow queue behind each other for the same reason.
concurrency:
  group: ratings-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the Saturday gate reads data/ratings.json as it was before Friday
      # Saturday's retry only calls EA if Friday did not already bring in a NEW week: the iteration label
      # now must differ from the one committed before Friday (a commit alone can be an attribute fix on the
      # old week — Octo 2026-10-26). If history is too short to tell, the retry goes ahead.
      - name: Skip the Saturday retry when Friday got the new week
        id: gate
        run: |
          label() { python3 -c "import json,sys;print(json.load(sys.stdin)['iteration']['label'])"; }
          NOW=$(label < data/ratings.json)
          OLD=""
          OLD_REV=$(git rev-list -1 --before="40 hours ago" HEAD || true)
          if [ -n "$OLD_REV" ]; then OLD=$(git show "$OLD_REV:data/ratings.json" 2>/dev/null | label 2>/dev/null || true); fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "6" ] && [ -n "$OLD" ] && [ "$OLD" != "$NOW" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::Friday already brought in $NOW (was $OLD); no call to EA"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "::notice::iteration now '$NOW', before Friday '${OLD:-unknown}'"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The carry rule for players EA has stopped rating, checked offline before a single request goes out.
      - name: Free-agent carry tests (offline)
        if: steps.gate.outputs.skip != 'true'
        run: python3 tools/test_free_agent_pool.py
      - name: Fetch the feed
        if: steps.gate.outputs.skip != 'true'
        id: fetch
        run: |
          set +e
          if [ "${{ inputs.test_alert }}" = "true" ]; then echo "test_alert: simulating a failed fetch"; false; else python3 tools/fetch_ratings.py; fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Commit the snapshot
        if: steps.fetch.outputs.rc == '0'
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data/ratings.json data/stats data/history.json data/free-agents.json
          git commit -m "Ratings snapshot: $(python3 -c "import json;d=json.load(open('data/ratings.json'));print(d['iteration']['label'],'·',d['count'],'players')")"
          # autostash for the same reason the NBA workflow has it (2026-09-21): a stray working-tree file
          # made `git pull --rebase` refuse and paged the owner although the fetch itself was fine.
          git -c rebase.autoStash=true pull --rebase
          git push
      - name: Fail loudly if the fetch broke (rc 2 = fetch/sanity failure; 3 = unchanged, fine)
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outputs.rc != '0' && steps.fetch.outputs.rc != '3'
        run: |
          echo "fetch_ratings.py exited ${{ steps.fetch.outputs.rc }}"
          exit 1
      # A silent failure is the one thing this workflow must never do: the page would keep saying
      # "updated <old date>" in 13px grey. Any failed step (fetch, commit, push) sends one Telegram
      # message to the owner. Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (repo settings).
      - name: Tell the owner on Telegram if anything failed
        if: failure()
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RC: ${{ steps.fetch.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$BOT" ] && [ -n "$CHAT" ] || { echo "no Telegram secrets; skipping alert"; exit 0; }
          TEXT="🏈 Janafari ratings refresh FAILED (fetch rc=${RC:-?}). EA's feed or the commit step broke — the page keeps its last good numbers. ${RUN_URL}"
          curl -fsS -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${TEXT}" -o /dev/null \
            || echo "Telegram alert could not be sent"
